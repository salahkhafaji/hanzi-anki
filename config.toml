[deck]
parent = "Chinese Word"     # your existing deck in Anki. Must match its name exactly
name = "Hanzi Strokes"       # default subdeck name (used when you just press Enter)
first_number = 1             # number of the first subdeck, the next ones count up
model_id = 1760400000002     # keep stable

[paths]
all_json = "data/all.json"
words = "input/words.txt"
audio_dir = "input/audio"
output = "output/hanzi.apkg"
subdecks = "data/subdecks.json"   # remembers the number of each subdeck

[animation]
width = 120
height = 120
speed = 1.5
delay_between_strokes = 150
delay_between_loops = 1500

[colors]
stroke = "#1f2937"
stroke_night = "#f2f2f2"
radical = "#e11d48"
outline = "#e5e7eb"
outline_night = "#444444"
highlight = "#2563eb"
