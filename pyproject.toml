[project]
name = "hanzi-anki"
version = "0.1.0"
description = "Build Anki decks with offline stroke-order animation and audio for Chinese words and sentences"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["genanki"]

[project.optional-dependencies]
pinyin = ["pypinyin"]

[project.scripts]
hanzi-anki = "hanzi_anki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hanzi_anki"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
